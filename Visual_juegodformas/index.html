<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego de Clasificación</title>
    <link rel="stylesheet"> css/estilo.css>
</head>
<body>

    <h1>Clasifica las Figuras</h1>

    <div class="contenedor-figuras">
        <div class="figura circulo" draggable="true" id="circulo"></div>
        <div class="figura cuadrado" draggable="true" id="cuadrado"></div>
        <div class="figura triangulo" draggable="true" id="triangulo"></div>
    </div>

    <div class="zonas">
        <div class="zona" data-tipo="circulo">Círculos</div>
        <div class="zona" data-tipo="cuadrado">Cuadrados</div>
        <div class="zona" data-tipo="triangulo">Triángulos</div>
    </div>

    <js>
    <formas></formas>.js
</body>
</html>
